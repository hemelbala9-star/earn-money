<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ড্যাশবোর্ড - ইনভেস্টমেন্ট প্ল্যাটফর্ম</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            padding-bottom: 70px; /* নিচের নেভিগেশন বারের জায়গার জন্য */
        }

        /* Top Header */
        .header {
            background-color: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #330000;
        }

        .header h1 {
            font-size: 20px;
            color: #ff1a1a;
        }

        .user-info {
            font-size: 14px;
            color: #cccccc;
        }

        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #1a1a1a, #330000);
            margin: 20px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #ff1a1a;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
            text-align: center;
        }

        .balance-card h3 {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 5px;
        }

        .balance-card h2 {
            font-size: 28px;
            color: #ffffff;
            font-weight: bold;
        }

        /* Action Buttons (Deposit / Withdraw) */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin: 0 20px 20px 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background-color: #ff1a1a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
        }

        .action-btn:hover {
            background-color: #e00000;
        }

        .action-btn.secondary {
            background-color: #262626;
            border: 1px solid #444444;
        }

        .action-btn.secondary:hover {
            background-color: #333333;
        }

        /* Investment Plans Section */
        .section-title {
            margin: 0 20px 15px 20px;
            font-size: 18px;
            color: #ff1a1a;
            border-left: 4px solid #ff1a1a;
            padding-left: 8px;
        }

        .plans-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 0 20px;
        }

        .plan-card {
            background-color: #1a1a1a;
            border: 1px solid #330000;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info h4 {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .plan-info p {
            font-size: 13px;
            color: #aaaaaa;
        }

        .invest-btn {
            background-color: #ff1a1a;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .invest-btn:hover {
            background-color: #e00000;
        }
