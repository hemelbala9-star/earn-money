<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen pb-16">
    <!-- Top Header -->
    <header class="bg-[#1e1e1e] border-b border-[#d4af37]/20 p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-[#d4af37]">Earn Money</h1>
        <div class="flex items-center gap-3">
            <span class="bg-[#2a2a2a] px-3 py-1 rounded-full text-xs border border-[#d4af37]/30">🇧🇩 ৳0.00</span>
            <a href="login.html" class="bg-red-500/20 text-red-400 p-1.5 rounded-lg text-xs">🚪 Logout</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-md mx-auto">
        <!-- Balance Card -->
        <div class="bg-gradient-to-r from-[#1e1e1e] to-[#2a2a2a] border border-[#d4af37]/40 p-5 rounded-2xl shadow-xl">
            <p class="text-xs text-gray-400">Total Balance</p>
            <h2 class="text-3xl font-extrabold text-[#d4af37] my-1">৳0.00</h2>
            <div class="flex gap-2 mt-4">
                <a href="deposit.html" class="flex-1 bg-amber-500 text-black text-center py-2 rounded-lg font-semibold text-sm">Deposit</a>
                <a href="withdraw.html" class="flex-1 bg-[#333] text-white text-center py-2 rounded-lg font-semibold text-sm border border-gray-600">Withdraw</a>
            </div>
        </div>

        <!-- Quick Links Grid -->
        <div class="grid grid-cols-3 gap-3">
            <a href="game.html" class="bg-[#1e1e1e] border border-gray-800 p-4 rounded-xl text-center hover:border-[#d4af37] transition">
                <span class="text-2xl">🎮</span>
                <p class="text-xs mt-2 text-gray-300">Games</p>
            </a>
            <a href="task.html" class="bg-[#1e1e1e] border border-gray-800 p-4 rounded-xl text-center hover:border-[#d4af37] transition">
                <span class="text-2xl">📋</span>
                <p class="text-xs mt-2 text-gray-300">Tasks</p>
            </a>
            <a href="referral.html" class="bg-[#1e1e1e] border border-gray-800 p-4 rounded-xl text-center hover:border-[#d4af37] transition">
                <span class="text-2xl">👥</span>
                <p class="text-xs mt-2 text-gray-300">Referral</p>
            </a>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1e1e1e] border-t border-[#d4af37]/20 flex justify-around py-3">
        <a href="dashboard.html" class="text-[#d4af37] text-xs text-center">🏠<br>Home</a>
        <a href="game.html" class="text-gray-400 text-xs text-center">🎮<br>Games</a>
        <a href="profile.html" class="text-gray-400 text-xs text-center">👤<br>Profile</a>
    </nav>
</body>
</html>
