<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Earn Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding-bottom: 20px;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info h3 {
            font-size: 16px;
        }
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
        }
        .container {
            padding: 15px;
        }
        .balance-card {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .balance-card h2 {
            font-size: 32px;
            margin: 10px 0;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .grid-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .grid-item span {
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .notice {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <h3>স্বাগতম, ইউজার!</h3>
        </div>
        <a href="login.html" class="logout-btn">লগআউট</a>
    </header>

    <div class="container">
        <div class="balance-card">
            <p>বর্তমান ব্যালেন্স</p>
            <h2>৳ 0.00</h2>
            <p>প্ল্যান: ফ্রি মেম্বার</p>
        </div>

        <div class="action-grid">
            <a href="task.html" class="grid-item">
                <span>📺</span>
                ডেইলি টাস্ক (Ads)
            </a>
            <a href="deposit.html" class="grid-item">
                <span>💳</span>
                ডিপোজিট
            </a>
            <a href="withdraw.html" class="grid-item">
                <span>🏧</span>
                উইথড্র
            </a>
            <a href="#" class="grid-item">
                <span>👥</span>
                রেফারেল
            </a>
        </div>

        <div class="notice">
            📢 <strong>নোটিশ:</strong> প্রতিদিনের টাস্ক সম্পূর্ণ করে ব্যালেন্স বাড়ান। যেকোনো সমস্যায় সাপোর্ট টিমে যোগাযোগ করুন।
        </div>
    </div>

</body>
</html>
