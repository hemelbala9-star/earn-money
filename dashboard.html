<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Earn Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            padding-bottom: 75px;
        }

        /* Top Header */
        .header {
            background: linear-gradient(180deg, #120202 0%, #080808 100%);
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #260505;
        }

        .brand-title {
            font-size: 20px;
            font-weight: bold;
            color: #ff2a2a;
            letter-spacing: 0.5px;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-crown {
            font-size: 20px;
            cursor: pointer;
            display: none; /* ডিফল্টভাবে লুকিয়ে থাকবে, অ্যাডমিন হলে শো করবে */
        }

        .bell-icon {
            font-size: 18px;
            color: #b3b3b3;
            cursor: pointer;
        }

        /* Dual Wallets Container */
        .wallets-container {
            display: flex;
            gap: 12px;
            margin: 15px 20px;
        }

        .wallet-card {
            flex: 1;
            background: linear-gradient(135deg, #150505 0%, #1f0808 100%);
            padding: 16px 12px;
            border-radius: 14px;
            border: 1px solid #3d0a0a;
            box-shadow: 0 6px 15px rgba(255, 0, 0, 0.08);
            text-align: center;
        }

        .wallet-card h3 {
            font-size: 11px;
            color: #999999;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .wallet-card h2 {
            font-size: 18px;
            color: #ffffff;
            font-weight: bold;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin: 0 20px 20px 20px;
        }

        .action-btn {
            flex: 1;
            padding: 13px;
            background: linear-gradient(135deg, #e60000 0%, #990000 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(230, 0, 0, 0.3);
            transition: 0.3s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, #1a1a1a 0%, #111111 100%);
            border: 1px solid #333333;
            box-shadow: none;
            color: #cccccc;
        }

        /* Section Title */
        .section-title {
            margin: 0 20px 12px 20px;
            font-size: 16px;
            color: #ff2a2a;
            font-weight: bold;
            border-left: 3px solid #ff2a2a;
            padding-left: 8px;
        }

        /* History Summary Grid */
        .history-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 20px 20px 20px;
        }

        .history-box {
            background: linear-gradient(135deg, #120404 0%, #170707 100%);
            border: 1px solid #2b0808;
            padding: 14px 10px;
            border-radius: 12px;
            text-align: center;
        }

        .history-box span {
            font-size: 11px;
            color: #8c8c8c;
            display: block;
            margin-bottom: 5px;
        }

        .history-box h4 {
            font-size: 15px;
            color: #ff4d4d;
        }

        /* Investment Plans Section */
        .plans-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0 20px 25px 20px;
        }

        .plan-card {
            background: linear-gradient(135deg, #140404 0%, #1a0808 100%);
            border: 1px solid #330a0a;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info h4 {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .plan-info p {
            font-size: 12px;
            color: #a6a6a6;
        }
