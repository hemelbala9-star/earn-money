<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Earn Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .info-box {
            background: #eef5fc;
            border: 1px solid #3498db;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>টাকা উত্তোলন (Withdraw)</h2>

        <div class="info-box">
            <p><strong>সর্বনিম্ন উইথড্র:</strong> ৳ ২০০</p>
            <p style="margin-top: 5px; font-size: 12px; color: #666;">* ২৪ ঘণ্টার মধ্যে আপনার অ্যাকাউন্টে টাকা পৌঁছে যাবে।</p>
        </div>

        <form>
            <div class="input-group">
                <label>পেমেন্ট মেথড সিলেক্ট করুন</label>
                <select required>
                    <option value="">সিলেক্ট করুন</option>
                    <option value="bkash">Bkash Personal</option>
                    <option value="nagad">Nagad Personal</option>
                    <option value="rocket">Rocket Personal</option>
                </select>
            </div>
            <div class="input-group">
                <label>উইথড্র করার পরিমাণ (BDT)</label>
                <input type="number" placeholder="সর্বনিম্ন ২০০ টাকা" required>
            </div>
            <div class="input-group">
                <label>আপনার অ্যাকাউন্ট নম্বর</label>
                <input type="text" placeholder="মোবাইল নম্বর দিন" required>
            </div>
            <button type="submit" class="btn-submit">উইথড্র রিকোয়েস্ট পাঠান</button>
        </form>

        <a href="dashboard.html" class="back-link">← ড্যাশবোর্ডে ফিরে যান</a>
    </div>

</body>
</html>
