<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - Earn Money</title>
  <style>
    body { background-color: #0b0e14; color: #fff; font-family: Arial, sans-serif; padding-bottom: 80px; }
    .container { max-width: 450px; margin: auto; padding: 20px; }
    .card { background: #161b22; padding: 20px; border-radius: 15px; border: 1px solid #30363d; margin-bottom: 15px; }
    h2 { color: #ffb703; text-align: center; font-size: 20px; margin-bottom: 15px; }
    label { font-size: 13px; color: #8b949e; display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 12px; margin-top: 5px; background: #0b0e14; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 13px; margin-top: 20px; background: linear-gradient(135deg, #ffc107 0%, #e2a014 100%); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .notice { background: #1f242d; border-left: 4px solid #ff5252; padding: 12px; font-size: 13px; color: #ccc; border-radius: 4px; margin-bottom: 15px; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 1000; }
    .bottom-nav a { color: #888; text-decoration: none; text-align: center; font-size: 11px; }
    .bottom-nav a.active { color: #ffb703; }
    .bottom-nav div { font-size: 18px; }
  </style>
</head>
<body>

<div class="container">
  <h2>টাকা উত্তোলন (Withdraw)</h2>

  <div class="notice" id="withdraw-notice">
    <b>নোটিশ:</b> টার্নওভার শূন্য (0) না হলে এবং দৈনিক লিমিট শেষ হলে উইথড্র করতে পারবেন না।
  </div>

  <div class="card">
    <label>ওয়ালেট সিলেক্ট করুন</label>
    <select id="wallet-type">
      <option value="incomeWallet">Income Wallet</option>
      <option value="bonusWallet">Bonus Wallet</option>
    </select>

    <label>পরিমাণ (BDT)</label>
    <input type="number" id="wd-amount" placeholder="ন্যূনতম পরিমাণ লিখুন">

    <label>পেমেন্ট নম্বর (প্রোফাইল থেকে বাইন্ড করা)</label>
    <input type="text" id="bound-number" disabled placeholder="লোড হচ্ছে...">

    <button onclick="submitWithdraw()">উত্তোলন রিকোয়েস্ট পাঠান</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="dashboard.html"><div>🏠</div>হোম</a>
  <a href="plan.html"><div>📈</div>পরিকল্পনা</a>
  <a href="deposit.html"><div>💳</div>জমা</a>
  <a href="game.html"><div>🎮</div>GAME</a>
  <a href="withdraw.html" class="active"><div>🏧</div>উত্তোলন</a>
  <a href="profile.html"><div>👤</div>প্রোফাইল</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAkbZY2YfJ5nHuIDUbUStIX2lIRtdzRQxY",
    authDomain: "earn-money-54b9d.firebaseapp.com",
    projectId: "earn-money-54b9d",
    storageBucket: "earn-money-54b9d.firebasestorage.app",
    messagingSenderId: "1048733611672",
    appId: "1:1048733611672:web:3766b73fc5c784f3c682ed"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let userData = null;

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        userData = snap.data();
        document.getElementById('bound-number').value = userData.paymentNumber || "নম্বর বাইন্ড করা নেই";
      }
    }
  });

  window.submitWithdraw = async () => {
    const user = auth.currentUser;
    if (!user || !userData) return alert("লগইন করা নেই!");

    if (!userData.paymentNumber) {
      alert("আগে প্রোফাইল থেকে বিকাশ/নগদ নম্বর বাইন্ড করুন!");
      window.location.href = "profile.html";
      return;
    }

    // টার্নওভার চেক
    if (userData.turnover > 0) {
      alert(`আপনার টার্নওভার বাকি আছে ৳${userData.turnover}! গেম খেলে টার্নওভার শূন্য করুন।`);
      return;
    }

    const walletType = document.getElementById('wallet-type').value;
    const amount = Number(document.getElementById('wd-amount').value);

    if (!amount || amount <= 0) {
      alert("সঠিক পরিমাণ লিখুন!");
      return;
    }

    if (userData[walletType] < amount) {
      alert("আপনার এই ওয়ালেটে পর্যাপ্ত ব্যালেন্স নেই!");
      return;
    }

    try {
      await addDoc(collection(db, "withdraws"), {
        uid: user.uid,
        email: user.email,
        wallet: walletType,
        amount: amount,
        number: userData.paymentNumber,
        status: "pending",
        timestamp: serverTimestamp()
      });

      alert("উত্তোলন রিকোয়েস্ট সফলভাবে জমা হয়েছে!");
      window.location.reload();
    } catch (error) {
      alert("ত্রুটি: " + error.message);
    }
  }
</script>
</body>
    </html>
