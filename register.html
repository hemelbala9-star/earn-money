<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Money - Register</title>
  <style>
    body { background-color: #0b0e14; color: #fff; font-family: Arial, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px 0; }
    .container { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
    
    .brand-header { text-align: center; margin-bottom: 20px; }
    .logo-icon { width: 65px; height: 65px; background: linear-gradient(135deg, #ffc107 0%, #e2a014 100%); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; color: #000; margin: 0 auto 8px; box-shadow: 0 0 20px rgba(255, 183, 3, 0.3); }
    .brand-header h1 { color: #ffb703; font-size: 22px; margin: 0; }
    .brand-header p { color: #8b949e; font-size: 12px; margin-top: 4px; }

    .card { background: #161b22; border: 1px solid #30363d; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .tab-container { display: flex; background: #0b0e14; border-radius: 12px; padding: 4px; margin-bottom: 20px; border: 1px solid #30363d; }
    .tab-btn { flex: 1; padding: 10px; text-align: center; background: transparent; border: none; color: #8b949e; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
    .tab-btn.active { background: #ffb703; color: #000; }

    label { font-size: 12px; color: #8b949e; display: block; margin-top: 12px; }
    .input-box { position: relative; margin-top: 4px; }
    input { width: 100%; padding: 11px 15px; background: #0b0e14; border: 1px solid #30363d; color: white; border-radius: 10px; box-sizing: border-box; font-size: 14px; outline: none; }
    input:focus { border-color: #ffb703; }
    
    .phone-row { display: flex; gap: 8px; margin-top: 4px; }
    .country-code { width: 95px; background: #0b0e14; border: 1px solid #30363d; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; gap: 5px; }

    .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #8b949e; font-size: 14px; }
    .submit-btn { width: 100%; padding: 14px; margin-top: 20px; background: linear-gradient(135deg, #ffc107 0%, #e2a014 100%); color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; transition: 0.3s; }
    .submit-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">
  <div class="brand-header">
    <div class="logo-icon">৳</div>
    <h1>Earn Money</h1>
    <p>স্মার্ট বিনিয়োগ প্ল্যাটফর্ম</p>
  </div>

  <div class="card">
    <div class="tab-container">
      <a href="login.html" class="tab-btn">🔑 লগইন</a>
      <a href="register.html" class="tab-btn active">📝 রেজিস্ট্রেশন</a>
    </div>

    <div>
      <label>পুরো নাম</label>
      <input type="text" id="reg-name" placeholder="Your full name">

      <label>ইমেইল</label>
      <input type="email" id="reg-email" placeholder="your@email.com">

      <label>ফোন নাম্বার</label>
      <div class="phone-row">
        <div class="country-code">🇧🇩 +880</div>
        <input type="text" id="reg-phone" placeholder="01XXXXXXXXX">
      </div>

      <label>পাসওয়ার্ড</label>
      <div class="input-box">
        <input type="password" id="reg-password" placeholder="Min 6 characters">
        <span class="eye-icon" onclick="togglePassword('reg-password', this)">👁️</span>
      </div>

      <label>পাসওয়ার্ড নিশ্চিত করুন</label>
      <div class="input-box">
        <input type="password" id="reg-cpassword" placeholder="Re-enter password">
        <span class="eye-icon" onclick="togglePassword('reg-cpassword', this)">👁️</span>
      </div>

      <label>রেফারেল কোড (ঐচ্ছিক)</label>
      <input type="text" id="reg-ref" placeholder="ENTER REFERRAL CODE">

      <button class="submit-btn" onclick="handleRegister()">একউন্ট তৈরি করুন →</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAkbZY2YfJ5nHuIDUbUStIX2lIRtdzRQxY",
    authDomain: "earn-money-54b9d.firebaseapp.com",
    projectId: "earn-money-54b9d",
    storageBucket: "earn-money-54b9d.firebasestorage.app",
    messagingSenderId: "1048733611672",
    appId: "1:1048733611672:web:3766b73fc5c784f3c682ed"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // অটোমেটিক ইউআরএল থেকে রেফার কোড ধরার লজিক
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
      document.getElementById('reg-ref').value = refCode;
    }
  });

  window.togglePassword = (id, el) => {
    const input = document.getElementById(id);
    if (input.type === 'password') {
      input.type = 'text';
      el.innerText = '🙈';
    } else {
      input.type = 'password';
      el.innerText = '👁️';
    }
  };

  window.handleRegister = async () => {
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const phone = document.getElementById('reg-phone').value;
    const pass = document.getElementById('reg-password').value;
    const cpass = document.getElementById('reg-cpassword').value;
    const refBy = document.getElementById('reg-ref').value;

    if (!name || !email || !phone || !pass || !cpass) {
      alert("সবগুলো ফিল্ড পূরণ করা বাধ্যতামূলক!");
      return;
    }

    if (pass !== cpass) {
      alert("পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড মিলছে না!");
      return;
    }

    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, pass);
      const user = userCred.user;
      const myRefCode = user.uid.substring(0, 6).toUpperCase();

      await setDoc(doc(db, "users", user.uid), {
        name: name,
        email: email,
        phone: "+880" + phone,
        referCode: myRefCode,
        referredBy: refBy || "None",
        depositWallet: 0,
        bonusWallet: 0,
        incomeWallet: 0,
        turnover: 0,
        paymentNumber: "",
        role: "user",
        createdAt: serverTimestamp()
      });

      alert("রেজিস্ট্রেশন সফল হয়েছে!");
      window.location.href = "index.html";
    } catch (error) {
      alert("রেজিস্ট্রেশন ব্যর্থ: " + error.message);
    }
  };
</script>

</body>
</html>
