<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Earn Money</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .welcome-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .welcome-header h1 {
      color: #ffb703;
      font-size: 26px;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(255, 183, 3, 0.3);
    }
    .welcome-header p {
      color: #8b949e;
      font-size: 14px;
    }
    .card {
      background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
      border: 2px solid #e2a014;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 25px rgba(226, 160, 20, 0.2);
    }
    h2 {
      text-align: center;
      color: #ffb703;
      margin-bottom: 20px;
      font-size: 20px;
    }
    label {
      font-size: 13px;
      color: #c9d1d9;
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: #0b0e14;
      border: 1px solid #30363d;
      color: white;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }
    input:focus {
      border-color: #ffb703;
      box-shadow: 0 0 8px rgba(255, 183, 3, 0.3);
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 25px;
      background: linear-gradient(135deg, #ffc107 0%, #e2a014 100%);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(226, 160, 20, 0.4);
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.9;
    }
    .link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #8b949e;
    }
    .link a {
      color: #ffb703;
      text-decoration: none;
      font-weight: bold;
    }
    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- উপরে আকর্ষণীয় ওয়েলকাম হেডার -->
  <div class="welcome-header">
    <h1>Welcome to Earn Money ✨</h1>
    <p>আপনার অ্যাকাউন্ট তৈরি করে আজই আয় শুরু করুন</p>
  </div>

  <div class="card">
    <h2>নতুন অ্যাকাউন্ট রেজিস্ট্রেশন</h2>
    
    <label>আপনার নাম</label>
    <input type="text" id="reg-name" placeholder="পূর্ণ নাম লিখুন">

    <label>ইমেইল এড্রেস</label>
    <input type="email" id="reg-email" placeholder="example@gmail.com">

    <label>পাসওয়ার্ড</label>
    <input type="password" id="reg-password" placeholder="কমপক্ষে ৬ ডিজিটের পাসওয়ার্ড">

    <label>রেফার কোড (ঐচ্ছিক)</label>
    <input type="text" id="ref-code" placeholder="রেফার কোড থাকলে দিন">

    <button id="register-btn">রেজিস্ট্রেশন করুন</button>

    <div class="link">
      ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAkbZY2YfJ5nHuIDUbUStIX2lIRtdzRQxY",
      authDomain: "earn-money-54b9d.firebaseapp.com",
      projectId: "earn-money-54b9d",
      storageBucket: "earn-money-54b9d.firebasestorage.app",
      messagingSenderId: "1048733611672",
      appId: "1:1048733611672:web:3766b73fc5c784f3c682ed"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('register-btn').addEventListener('click', async () => {
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      if (!name || !email || !password) {
        alert("সবগুলো ঘর সঠিকভাবে পূরণ করুন!");
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: name,
          email: email,
          incomeWallet: 0,
          bonusWallet: 0,
          depositWallet: 0,
          turnover: 0,
          totalDeposit: 0,
          totalWithdraw: 0,
          totalProfit: 0,
          referBonus: 0,
          role: "user"
        });

        alert("সফলভাবে রেজিস্ট্রেশন সম্পন্ন হয়েছে!");
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("ত্রুটি: " + error.message);
      }
    });
  </script>
</body>
</html>
