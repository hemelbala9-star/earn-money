<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white flex justify-center items-center min-h-screen">
    <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-6 rounded-2xl w-full max-w-sm shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-[#d4af37]">Earn Money</h1>
            <p class="text-sm text-gray-400">Create a new account</p>
        </div>
        
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Email or Phone</label>
                <input type="text" id="email" required class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Password</label>
                <input type="password" id="password" required class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Referral Code (Optional)</label>
                <input type="text" id="referralCode" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-semibold py-2.5 rounded-lg shadow-lg hover:opacity-90 transition">Register</button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-4">
            Already have an account? <a href="login.html" class="text-[#d4af37] font-semibold">Login</a>
        </p>
    </div>
</body>
</html>
