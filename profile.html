<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Tasks & Gifts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen pb-16">
    <!-- Top Header -->
    <header class="bg-[#1e1e1e] border-b border-[#d4af37]/20 p-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="text-[#d4af37] text-lg font-bold">←</a>
            <h1 class="text-lg font-bold text-[#d4af37]">Tasks & Daily Gifts</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-md mx-auto">
        <!-- Daily Gift Card -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-5 rounded-2xl shadow-xl space-y-3">
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-bold text-[#d4af37]">🎁 Daily Login Gift</h3>
                    <p class="text-xs text-gray-400">Claim your free reward every day</p>
                </div>
                <span class="text-2xl">🎁</span>
            </div>
            <button class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-semibold py-2 rounded-lg text-sm shadow-lg hover:opacity-95 transition">Claim Daily Gift</button>
        </div>

        <!-- Gift Code Redeem Card -->
        <div class="bg-[#1e1e1e] border border-gray-800 p-5 rounded-2xl shadow-xl space-y-3">
            <h3 class="text-sm font-bold text-white">🎟️ Redeem Gift Code</h3>
            <div>
                <input type="text" id="giftCode" placeholder="Enter gift code" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>
            <button class="w-full bg-[#333] border border-[#d4af37]/50 text-[#d4af37] font-semibold py-2 rounded-lg text-sm hover:bg-[#d4af37] hover:text-black transition">Redeem Now</button>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1e1e1e] border-t border-[#d4af37]/20 flex justify-around py-3">
        <a href="dashboard.html" class="text-gray-400 text-xs text-center">🏠<br>Home</a>
        <a href="game.html" class="text-gray-400 text-xs text-center">🎮<br>Games</a>
        <a href="profile.html" class="text-gray-400 text-xs text-center">👤<br>Profile</a>
    </nav>
</body>
</html>
