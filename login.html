<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Earn Money</title>
  <style>
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .welcome-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .welcome-header h1 {
      color: #ffb703;
      font-size: 26px;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(255, 183, 3, 0.3);
    }
    .welcome-header p {
      color: #8b949e;
      font-size: 14px;
    }
    .card {
      background: linear-gradient(135deg, #161b22 0%, #0d1117 100%);
      border: 2px solid #e2a014;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 25px rgba(226, 160, 20, 0.2);
    }
    h2 {
      text-align: center;
      color: #ffb703;
      margin-bottom: 20px;
      font-size: 20px;
    }
    label {
      font-size: 13px;
      color: #c9d1d9;
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: #0b0e14;
      border: 1px solid #30363d;
      color: white;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }
    input:focus {
      border-color: #ffb703;
      box-shadow: 0 0 8px rgba(255, 183, 3, 0.3);
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 25px;
      background: linear-gradient(135deg, #ffc107 0%, #e2a014 100%);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(226, 160, 20, 0.4);
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.9;
    }
    .link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #8b949e;
    }
    .link a {
      color: #ffb703;
      text-decoration: none;
      font-weight: bold;
    }
    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="welcome-header">
    <h1>Welcome back to Earn Money 👋</h1>
    <p>আপনার অ্যাকাউন্ট দিয়ে লগইন করুন</p>
  </div>

  <div class="card">
    <h2>অ্যাকাউন্ট লগইন</h2>
    
    <label>ইমেইল এড্রেস</label>
    <input type="email" id="login-email" placeholder="আপনার ইমেইল লিখুন">

    <label>পাসওয়ার্ড</label>
    <input type="password" id="login-password" placeholder="পাসওয়ার্ড লিখুন">

    <button id="login-btn">লগইন করুন</button>

    <div class="link">
      অ্যাকাউন্ট নেই? <a href="register.html">নতুন অ্যাকাউন্ট তৈরি করুন</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAkbZY2YfJ5nHuIDUbUStIX2lIRtdzRQxY",
      authDomain: "earn-money-54b9d.firebaseapp.com",
      projectId: "earn-money-54b9d",
      storageBucket: "earn-money-54b9d.firebasestorage.app",
      messagingSenderId: "1048733611672",
      appId: "1:1048733611672:web:3766b73fc5c784f3c682ed"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        alert("দয়া করে ইমেইল এবং পাসওয়ার্ড দিন!");
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("লগইন সফল হয়েছে!");
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("লগইন ব্যর্থ হয়েছে: " + error.message);
      }
    });
  </script>
</body>
</html>
