<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Earn Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 30px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .footer-link a {
            color: #27ae60;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>লগইন করুন</h2>
        <form action="dashboard.html">
            <div class="input-group">
                <label>ইমেইল অথবা নম্বর</label>
                <input type="text" placeholder="ইমেইল বা নম্বর দিন" required>
            </div>
            <div class="input-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" placeholder="পাসওয়ার্ড দিন" required>
            </div>
            <button type="submit" class="btn-submit">লগইন</button>
        </form>
        <div class="footer-link">
            অ্যাাকাউন্ট নেই? <a href="register.html">রেজিস্টার করুন</a>
        </div>
    </div>

</body>
</html>
