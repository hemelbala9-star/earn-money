<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - ইনভেস্টমেন্ট প্ল্যাটফর্ম</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid #330000;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #ff1a1a;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background-color: #262626;
            border: 1px solid #444444;
            border-radius: 5px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ff1a1a;
            box-shadow: 0 0 5px rgba(255, 26, 26, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #ff1a1a;
            border: none;
            border-radius: 5px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background-color: #e00000;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #aaaaaa;
        }

        .register-link a {
            color: #ff1a1a;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>লগইন করুন</h2>
        <form action="dashboard.html" method="POST">
            <div class="input-group">
                <label for="phone">ফোন নম্বর</label>
                <input type="text" id="phone" name="phone" placeholder="আপনার ফোন নম্বর দিন" required>
            </div>
            
            <div class="input-group">
                <label for="password">পাসওয়ার্ড</label>
                <input type="password" id="password" name="password" placeholder="আপনার পাসওয়ার্ড দিন" required>
            </div>

            <button type="submit" class="login-btn">লগইন</button>
        </form>

        <div class="register-link">
            একাউন্ট নেই? <a href="register.html">রেজিস্ট্রেশন করুন</a>
        </div>
    </div>

</body>
</html>
