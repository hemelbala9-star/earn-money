<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-[#121212] text-white flex justify-center items-center min-h-screen">
    <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-6 rounded-2xl w-full max-w-sm shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-[#d4af37]">Earn Money</h1>
            <p class="text-sm text-gray-400">Sign in to your account</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Email or Phone</label>
                <input type="text" id="loginEmail" required class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Password</label>
                <input type="password" id="loginPassword" required class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-semibold py-2.5 rounded-lg shadow-lg hover:opacity-90 transition">Login</button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-4">
            Don't have an account? <a href="register.html" class="text-[#d4af37] font-semibold">Register</a>
        </p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAkbZY2YfJ5nHuIDUbUStIX2lIRtdzRQxY",
            authDomain: "earn-money-54b9d.firebaseapp.com",
            projectId: "earn-money-54b9d",
            storageBucket: "earn-money-54b9d.firebasestorage.app",
            messagingSenderId: "1048733611672",
            appId: "1:1048733611672:web:3766b73fc5c784f3c682ed",
            measurementId: "G-QCLK8SKGSD"
        };
        firebase.initializeApp(firebaseConfig);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.innerText = "Logging in...";
            try {
                const userEmail = email.includes('@') ? email : `${email}@earnmoney.com`;
                await firebase.auth().signInWithEmailAndPassword(userEmail, password);
                alert("Login Successful!");
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("Login Failed: " + error.message);
                btn.innerText = "Login";
            }
        });
    </script>
</body>
    </html>
