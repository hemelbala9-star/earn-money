<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Wingo Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen pb-16">
    <!-- Top Header -->
    <header class="bg-[#1e1e1e] border-b border-[#d4af37]/20 p-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="text-[#d4af37] text-lg font-bold">←</a>
            <h1 class="text-lg font-bold text-[#d4af37]">Wingo Game</h1>
        </div>
        <span class="bg-[#2a2a2a] px-3 py-1 rounded-full text-xs border border-[#d4af37]/30">৳0.00</span>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-md mx-auto">
        <!-- Timer & Period Card -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-5 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-400">Period No</p>
                <h3 class="text-sm font-bold text-[#d4af37]" id="periodNo">2026080701</h3>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400">Time Remaining</p>
                <h3 class="text-lg font-extrabold text-red-500" id="timer">00:30</h3>
            </div>
        </div>

        <!-- Betting Board -->
        <div class="bg-[#1e1e1e] border border-gray-800 p-5 rounded-2xl shadow-xl space-y-4">
            <div class="grid grid-cols-3 gap-3">
                <button class="bg-green-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg">Green</button>
                <button class="bg-purple-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg">Violet</button>
                <button class="bg-red-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg">Red</button>
            </div>

            <div class="grid grid-cols-5 gap-2">
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">0</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">1</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">2</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">3</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">4</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">5</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">6</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">7</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">8</button>
                <button class="bg-[#2a2a2a] border border-gray-700 py-2.5 rounded-lg font-bold text-sm">9</button>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Bet Amount</label>
                <input type="number" id="betAmount" placeholder="Enter amount" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>

            <button class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-semibold py-2.5 rounded-lg shadow-lg hover:opacity-90 transition">Place Bet</button>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#1e1e1e] border-t border-[#d4af37]/20 flex justify-around py-3">
        <a href="dashboard.html" class="text-gray-400 text-xs text-center">🏠<br>Home</a>
        <a href="game.html" class="text-[#d4af37] text-xs text-center">🎮<br>Games</a>
        <a href="profile.html" class="text-gray-400 text-xs text-center">👤<br>Profile</a>
    </nav>
</body>
</html>
