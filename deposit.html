<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Deposit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen pb-16">
    <!-- Top Header -->
    <header class="bg-[#1e1e1e] border-b border-[#d4af37]/20 p-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="text-[#d4af37] text-lg font-bold">←</a>
            <h1 class="text-lg font-bold text-[#d4af37]">Deposit Money</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 max-w-md mx-auto">
        <!-- Deposit Instructions / Methods -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-5 rounded-2xl shadow-xl space-y-4">
            <p class="text-xs text-gray-400">Select Payment Method</p>
            <div class="grid grid-cols-2 gap-3">
                <button class="bg-[#2a2a2a] border border-[#d4af37] p-3 rounded-xl text-center font-semibold text-sm">bKash</button>
                <button class="bg-[#2a2a2a] border border-gray-700 p-3 rounded-xl text-center font-semibold text-sm">Nagad</button>
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Enter Amount (BDT)</label>
                <input type="number" id="depositAmount" placeholder="e.g. 500" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>

            <div>
                <label class="block text-xs text-gray-400 mb-1">Transaction ID (TrxID)</label>
                <input type="text" id="trxId" placeholder="Enter Transaction ID" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-[#d4af37]">
            </div>

            <button class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 text-black font-semibold py-2.5 rounded-lg shadow-lg hover:opacity-90 transition">Submit Deposit</button>
        </div>
    </main>
</body>
</html>
