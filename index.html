<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - ইনভেস্টমেন্ট প্ল্যাটফর্ম</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #e60000 0%, #990000 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin: 0 auto 10px;
            box-shadow: 0 0 15px rgba(230, 0, 0, 0.4);
        }

        .brand-header h1 {
            color: #ff2a2a;
            font-size: 22px;
        }

        .brand-header p {
            color: #888888;
            font-size: 12px;
            margin-top: 3px;
        }

        .card {
            background: linear-gradient(180deg, #140404 0%, #0d0d0d 100%);
            border: 1px solid #3d0a0a;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .tab-container {
            display: flex;
            background: #080808;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid #2b0808;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            border: none;
            color: #888888;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #e60000 0%, #990000 100%);
            color: #fff;
            box-shadow: 0 2px 8px rgba(230, 0, 0, 0.3);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 12px;
            color: #aaaaaa;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #080808;
            border: 1px solid #330000;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff1a1a;
            box-shadow: 0 0 5px rgba(255, 26, 26, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: linear-gradient(135deg, #e60000 0%, #990000 100%);
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(230, 0, 0, 0.3);
            transition: 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div class="logo-icon">৳</div>
        <h1>Earn Money</h1>
        <p>স্মার্ট ইনভেস্টমেন্ট প্ল্যাটফর্ম</p>
    </div>

    <div class="card">
        <div class="tab-container">
            <a href="index.html" class="tab-btn active">🔑 লগইন</a>
            <a href="register.html" class="tab-btn">📝 রেজিস্ট্রেশন</a>
        </div>

        <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
            <div class="input-group">
                <label>ইমেইল অথবা ফোন নম্বর</label>
                <input type="text" placeholder="আপনার ইমেইল বা ফোন দিন" required>
            </div>

            <div class="input-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" placeholder="পাসওয়ার্ড দিন" required>
            </div>

            <button type="submit" class="submit-btn">লগইন করুন →</button>
        </form>
    </div>
</div>

</body>
</html>
