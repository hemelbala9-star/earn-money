<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen pb-16">
    <!-- Top Header -->
    <header class="bg-[#1e1e1e] border-b border-[#d4af37]/20 p-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <span class="text-[#d4af37] text-xl font-bold">👑</span>
            <h1 class="text-lg font-bold text-[#d4af37]">Admin Dashboard</h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="bg-[#2a2a2a] px-2.5 py-1 rounded-full text-xs border border-[#d4af37]/30">🇧🇩</span>
            <a href="profile.html" class="bg-[#2a2a2a] p-1.5 rounded-full border border-[#d4af37]/30 text-xs">🚪</a>
        </div>
    </header>

    <!-- Main Admin Sections -->
    <main class="p-4 space-y-3 max-w-md mx-auto">
        <!-- All Bets Wingo -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-4 rounded-2xl shadow-lg flex justify-between items-center cursor-pointer">
            <div class="flex items-center gap-3">
                <span class="text-xl">📡</span>
                <h3 class="text-sm font-bold text-white">All Bets Wingo</h3>
            </div>
            <span class="text-gray-400">▼</span>
        </div>

        <!-- Pending Deposits -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-4 rounded-2xl shadow-lg flex justify-between items-center cursor-pointer">
            <div class="flex items-center gap-3">
                <span class="text-xl">💳</span>
                <h3 class="text-sm font-bold text-white">Pending Deposits</h3>
            </div>
            <span class="text-gray-400">▼</span>
        </div>

        <!-- Pending Withdrawals -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-4 rounded-2xl shadow-lg flex justify-between items-center cursor-pointer">
            <div class="flex items-center gap-3">
                <span class="text-xl">💸</span>
                <h3 class="text-sm font-bold text-white">Pending Withdrawals</h3>
            </div>
            <span class="text-gray-400">▼</span>
        </div>

        <!-- User Management -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-4 rounded-2xl shadow-lg flex justify-between items-center cursor-pointer">
            <div class="flex items-center gap-3">
                <span class="text-xl">👥</span>
                <h3 class="text-sm font-bold text-white">User Management</h3>
            </div>
            <span class="text-gray-400">▼</span>
        </div>

        <!-- Referral Checker Settings -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-4 rounded-2xl shadow-lg space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-xl">🔗</span>
                    <h3 class="text-sm font-bold text-white">Referral Settings & Checker</h3>
                </div>
                <span class="text-gray-400">▼</span>
            </div>
            <div class="bg-[#2a2a2a] p-3 rounded-xl border border-gray-700 space-y-2">
                <label class="block text-xs text-gray-400">Referral Bonus Amount (BDT)</label>
                <div class="flex gap-2">
                    <input type="number" value="50" class="w-full bg-[#121212] border border-gray-600 rounded-lg px-3 py-1.5 text-sm text-[#d4af37] font-bold">
                    <button class="bg-amber-500 text-black px-4 py-1.5 rounded-lg text-xs font-semibold">Save</button>
                </div>
            </div>
        </div>

        <!-- Management Admin (Sub-Admin Permissions) -->
        <div class="bg-[#1e1e1e] border border-[#d4af37]/30 p-4 rounded-2xl shadow-lg space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="text-xl">🛠️</span>
                    <h3 class="text-sm font-bold text-[#d4af37]">Management Admin</h3>
                </div>
                <span class="text-gray-400">▼</span>
            </div>
            <p class="text-[11px] text-gray-400">Owner ছাড়া অন্য কেউ এই সেকশন দেখতে পাবে না।</p>
        </div>
    </main>
</body>
</html>
