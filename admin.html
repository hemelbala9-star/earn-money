<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Earn Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 15px;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .stat-card h4 {
            color: #7f8c8d;
            font-size: 13px;
        }
        .stat-card h2 {
            color: #2c3e50;
            margin-top: 5px;
        }
        .section-title {
            margin: 15px 0 10px;
            color: #2c3e50;
            font-size: 16px;
        }
        .table-container {
            background: white;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        .btn-approve {
            background: #27ae60;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-reject {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h2>Admin Dashboard</h2>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <h4>মোট ইউজার</h4>
            <h2>১২০</h2>
        </div>
        <div class="stat-card">
            <h4>মোট ডিপোজিট</h4>
            <h2>৳ ৫,০০০</h2>
        </div>
    </div>

    <h3 class="section-title">পেন্ডিং ডিপোজিট রিকোয়েস্ট</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ইউজার</th>
                    <th>মেথড</th>
                    <th>টাকা</th>
                    <th>TrxID</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01712345678</td>
                    <td>Bkash</td>
                    <td>৳ ৫০০</td>
                    <td>TRX987654</td>
                    <td>
                        <button class="btn-approve">Approve</button>
                        <button class="btn-reject">Reject</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <h3 class="section-title">পেন্ডিং উইথড্র রিকোয়েস্ট</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ইউজার</th>
                    <th>মেথড</th>
                    <th>টাকা</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01887654321</td>
                    <td>Nagad</td>
                    <td>৳ ২০০</td>
                    <td>
                        <button class="btn-approve">Approve</button>
                        <button class="btn-reject">Reject</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
              </html>
