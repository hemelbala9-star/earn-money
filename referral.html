<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral System - Earn Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .ref-box {
            background: #eef9f2;
            border: 1px dashed #27ae60;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .ref-code {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin: 8px 0;
            user-select: all;
        }
        .btn-copy {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .stat-item h3 {
            color: #2c3e50;
            font-size: 18px;
        }
        .stat-item p {
            color: #7f8c8d;
            font-size: 12px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>রেফারেল প্রোগ্রাম</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 15px;">বন্ধুদের ইনভাইট করুন এবং প্রতিটি রেফারেল থেকে ১০% কমিশন পান!</p>

        <div class="ref-box">
            <p style="font-size: 13px; color: #555;">আপনার রেফারেল লিংক:</p>
            <div class="ref-code" id="refLink">https://earn-money.vercel.app/register.html?ref=12345</div>
            <button class="btn-copy" onclick="copyLink()">লিঙ্ক কপি করুন</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <h3>০ জন</h3>
                <p>মোট রেফারেল</p>
            </div>
            <div class="stat-item">
                <h3>৳ ০.০০</h3>
                <p>রেফার ইনকাম</p>
            </div>
        </div>

        <a href="dashboard.html" class="back-link">← ড্যাশবোর্ডে ফিরে যান</a>
    </div>

    <script>
        function copyLink() {
            const linkText = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(linkText);
            alert('রেফারেল লিঙ্ক কপি করা হয়েছে!');
        }
    </script>

</body>
</html>
